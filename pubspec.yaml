name: cinema
description: "CINEMATE - A Simple and Beautiful Movie Discovery Application built with Flutter and Dart."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # HTTP client for REST API calls (TMDB API)
  http: ^1.2.1
  # Lightweight state management for sharing favourites across screens
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
